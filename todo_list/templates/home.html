{% extends 'base.html' %}

{% block content %}
<form class="form-inline my-2 my-lg-0" method="post">
    {% csrf_token %}
    {{ form.item }}
    <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Add to List</button>
</form>

<table class="table">
    <tbody>
        {% for things in all_items %}
        <tr>
            {% if things.completed %}
            <td><s>{{ things.item }}</s></td>
            <td class="text-end">
                <a class="btn btn-sm btn-warning" href="{% url 'unstrike' things.id %}">Unstrike</a>
                <a class="btn btn-sm btn-danger" href="{% url 'delete' things.id %}">Delete</a>
            </td>
            {% else %}
            <td>{{ things.item }}</td>
            <td class="text-end">
                <a class="btn btn-sm btn-success" href="{% url 'strike' things.id %}">Strike</a>
                <a class="btn btn-sm btn-danger" href="{% url 'delete' things.id %}">Delete</a>
            </td>
            {% endif %}
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No items yet.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
